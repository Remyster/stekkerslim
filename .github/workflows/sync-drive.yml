name: Sync kennisbank naar Google Drive

on:
  push:
    branches: [main]
    paths:
      - 'Kennisbank/**'
      # Ook draaien als de sync zelf verandert — anders moet je een
      # inhoudelijke Kennisbank-wijziging verzinnen om een fix te testen.
      - 'Scripts/sync-drive.js'
      - '.github/workflows/sync-drive.yml'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installeer dependencies
        run: npm install googleapis@144

      - name: Sync bestanden naar Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: '1n0648OBFmfUegMY1zZi-4nD_Ge3O6pRK'
        run: node Scripts/sync-drive.js
